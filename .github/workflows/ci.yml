name: Verificar edição
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit_local
          POSTGRES_DB: kit_entrevista_real
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U kit -d kit_entrevista_real"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: python -m pip install -r requirements-docs.txt
      - run: npm run release:check
      - run: npm run release:pack
